name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Ensure we have full history to manipulate tags.

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install towncrier

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "14"

      - name: Build Chrome extension
        run: |
          make chrome VERSION="${{ github.event.inputs.version }}"

      - name: Build Firefox extension
        run: |
          make firefox VERSION="${{ github.event.inputs.version }}"

      - name: Generate draft release notes with Towncrier
        run: |
          towncrier build --draft --version "${{ github.event.inputs.version }}" > draft_release_notes.md

      - name: Generate release notes with Towncrier
        run: |
          towncrier build --version "${{ github.event.inputs.version }}" --yes

      - name: Commit updated changelog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGES.md
          git commit -m "Generate release notes and update changelog for version ${{ github.event.inputs.version }}"
          git push origin main

      - name: Create tag
        run: |
          git tag -a "${{ github.event.inputs.version }}" -m "Release ${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: Create GitHub release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          draft: true  # Set to true to create a draft release.
          prerelease: false
          body_path: draft_release_notes.md
          files: |
            build/chrome-antares2goats-${{ github.event.inputs.version }}.zip
            build/firefox-antares2goats-${{ github.event.inputs.version }}.zip